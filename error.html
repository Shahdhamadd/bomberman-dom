<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{CODE}} — bomberman-dom</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%92%A3</text></svg>"
    />
    <style>
      :root {
        --font-arcade: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
        --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        --sky-top: #5cb3ff;
        --sky-bot: #2b6fc4;
        --panel: #182a54;
        --panel-2: #101d3d;
        --panel-line: #3b57a0;
        --panel-line-hi: #6d8ad6;
        --text: #eef3ff;
        --muted: #a9bbe8;
        --orange: #ff8a2b;
        --orange-lo: #c9560d;
        --yellow: #ffd23f;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-ui);
        color: var(--text);
        background: radial-gradient(
          1200px 700px at 50% -8%,
          #7cc6ff,
          var(--sky-top) 35%,
          var(--sky-bot)
        );
        background-attachment: fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.25) 2px, transparent 2px);
        background-size: 46px 46px;
        opacity: 0.35;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(520px, 100%);
        padding: 34px 28px 30px;
        text-align: center;
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 3px solid var(--panel-line);
        border-radius: 18px;
        box-shadow: inset 0 2px 0 var(--panel-line-hi), inset 0 -6px 0 rgba(0, 0, 0, 0.35),
          0 18px 40px rgba(0, 0, 0, 0.35);
      }

      .bomb {
        font-size: 64px;
        line-height: 1;
        animation: wobble 2.4s ease-in-out infinite;
      }
      @keyframes wobble {
        0%,
        100% {
          transform: rotate(-6deg) translateY(0);
        }
        50% {
          transform: rotate(6deg) translateY(-6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bomb {
          animation: none;
        }
      }

      .code {
        margin: 10px 0 0;
        font-family: var(--font-arcade);
        font-size: 58px;
        font-weight: 700;
        letter-spacing: 4px;
        color: var(--yellow);
        text-shadow: 0 4px 0 rgba(0, 0, 0, 0.4);
      }

      .title {
        margin: 6px 0 0;
        font-family: var(--font-arcade);
        font-size: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .message {
        margin: 14px auto 0;
        max-width: 40ch;
        color: var(--muted);
        line-height: 1.55;
      }

      .path {
        display: inline-block;
        margin-top: 16px;
        max-width: 100%;
        overflow-wrap: anywhere;
        padding: 7px 12px;
        border: 2px solid var(--panel-line);
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.25);
        font-family: var(--font-arcade);
        font-size: 14px;
        color: var(--text);
      }

      .home {
        display: inline-block;
        margin-top: 26px;
        padding: 13px 30px;
        border: 0;
        border-radius: 12px;
        font-family: var(--font-arcade);
        font-size: 16px;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-decoration: none;
        color: #3b1a00;
        background: linear-gradient(180deg, #ffb64d, var(--orange));
        box-shadow: 0 5px 0 var(--orange-lo), 0 9px 14px rgba(0, 0, 0, 0.35);
      }
      .home:hover {
        filter: brightness(1.06);
      }
      .home:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--orange-lo), 0 3px 6px rgba(0, 0, 0, 0.35);
      }
      .home:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card" role="alert">
        <div class="bomb" aria-hidden="true">💣</div>
        <p class="code">{{CODE}}</p>
        <h1 class="title">{{TITLE}}</h1>
        <p class="message">{{MESSAGE}}</p>
        <p><span class="path">{{PATH}}</span></p>
        <a class="home" href="/">Back to the game</a>
      </div>
    </main>
  </body>
</html>
